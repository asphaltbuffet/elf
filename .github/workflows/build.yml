# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Main Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Generate code and mocks
        run: |
          mise run generate
          mise run mock

      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            **/*_string.go
            **/mocks/mock_*.go

  govulncheck:
    name: govulncheck
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      # Use the latest stable Go (not go.mod's pinned version) on purpose:
      # govulncheck reports stdlib vulns based on the toolchain it runs under.
      # Scanning under the newest patch release clears stdlib advisories that
      # are already fixed upstream but not yet reflected in go.mod's version,
      # without changing the project's go.mod language version.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Download generated files
        uses: actions/download-artifact@v8
        with:
          name: generated

      - name: Mod tidy
        run: mise run mod-tidy

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Build and Test
    needs: generate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Download generated files
        uses: actions/download-artifact@v8
        with:
          name: generated

      - name: Mod tidy
        run: mise run mod-tidy

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      - name: Coverage
        run: mise run cover

      - name: Diff check
        run: mise run diff

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report-ubuntu-latest
          path: bin

      - name: Upload code coverage results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./bin/coverage.out
          flags: Linux

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pull from the cache to speed the build; no push on PRs (no authToken).
      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: asphaltbuffet

      - name: Build flake
        run: nix build .#default --print-build-logs --accept-flake-config

  lint:
    name: Lint
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Download generated files
        uses: actions/download-artifact@v8
        with:
          name: generated

      - name: Mod tidy
        run: mise run mod-tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9

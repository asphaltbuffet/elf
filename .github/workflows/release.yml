# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build the flake and push its closure to Cachix so NUR/flake consumers
  # substitute the prebuilt result instead of compiling from source. Runs
  # independently of goreleaser: a Cachix outage must not fail the release.
  nix-cache:
    name: Nix Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: asphaltbuffet
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build flake
        run: nix build .#default --print-build-logs --accept-flake-config

      - name: Push to Cachix
        run: cachix push asphaltbuffet ./result

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up mise
        uses: jdx/mise-action@v4

      - uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate code and mocks
        run: |
          mise run generate
          mise run mock

      - name: Generate completions
        run: mise run completions

      - name: Generate manpages
        run: mise run manpages

      - name: Assert CHANGELOG entry exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "Error: no '## [${VERSION}]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --release-notes=".changes/v${{ steps.version.outputs.version }}.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
